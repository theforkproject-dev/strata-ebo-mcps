app = "strata-research-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  GATEWAY_KIND = "research"
  DATA_DIR = "/data/research-mcp"
  PUBLIC_BASE_URL = "https://strata-research-mcp.fly.dev"
  OAUTH_ISSUER = "https://strata-research-mcp.fly.dev"
  OAUTH_STORE_PATH = "/data/research-mcp/oauth-store.json"
  XSEARCH_MODEL = "x-ai/grok-4.3"
  RESEARCH_ASSURANCE = "observed-l1"
  TENANT_ID = "default"
  OPERATOR_ID = "operator:amotivv-demo"

[[mounts]]
  source = "strata_research_mcp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
