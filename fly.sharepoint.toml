# Strata SharePoint MCP Gateway — read-only SharePoint (Nango → Microsoft Graph),
# observed-l1. Mirrors fly.research.toml. Secrets (fly secrets set, NEVER here):
#   NANGO_SECRET_KEY, NANGO_SHAREPOINT_CONNECTION_ID, SHAREPOINT_DEFAULT_SITE_ID,
#   OAUTH_CONSENT_PASSWORD, MCP_SESSION_SECRET
app = "strata-sharepoint-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  GATEWAY_KIND = "sharepoint"
  DATA_DIR = "/data/sharepoint-mcp"
  PUBLIC_BASE_URL = "https://strata-sharepoint-mcp.fly.dev"
  OAUTH_ISSUER = "https://strata-sharepoint-mcp.fly.dev"
  OAUTH_STORE_PATH = "/data/sharepoint-mcp/oauth-store.json"
  SHAREPOINT_ASSURANCE = "observed-l1"
  NANGO_SHAREPOINT_PROVIDER_CONFIG_KEY = "sharepoint-online"
  TENANT_ID = "default"
  OPERATOR_ID = "operator:amotivv-demo"

[[mounts]]
  source = "strata_sharepoint_mcp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
