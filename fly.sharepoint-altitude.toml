# Strata SharePoint MCP Gateway — ALTITUDE VENTURES instance (per-org, single-tenant:
# static Nango connection = altvc.sharepoint.com ONLY). Secrets (fly secrets set):
#   NANGO_SECRET_KEY, NANGO_SHAREPOINT_CONNECTION_ID, SHAREPOINT_DEFAULT_SITE_ID,
#   OAUTH_CONSENT_PASSWORD, MCP_SESSION_SECRET
app = "strata-sharepoint-altitude-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  GATEWAY_KIND = "sharepoint"
  DATA_DIR = "/data/sharepoint-mcp"
  # Credential longevity: platform vaults auto-refresh mcp_oauth tokens, but an
  # idle credential older than the REFRESH TTL dies permanently (invalidated,
  # retries exhausted) — the SharePoint org credential died exactly this way
  # after 8 idle days on the 7d default. 24h access / 90d refresh.
  OAUTH_ACCESS_TOKEN_TTL_SECONDS = "86400"
  OAUTH_REFRESH_TOKEN_TTL_SECONDS = "7776000"
  PUBLIC_BASE_URL = "https://strata-sharepoint-altitude-mcp.fly.dev"
  OAUTH_ISSUER = "https://strata-sharepoint-altitude-mcp.fly.dev"
  OAUTH_STORE_PATH = "/data/sharepoint-mcp/oauth-store.json"
  SHAREPOINT_ASSURANCE = "observed-l1"
  NANGO_SHAREPOINT_PROVIDER_CONFIG_KEY = "sharepoint-altitude"
  TENANT_ID = "default"
  OPERATOR_ID = "operator:altitude"

[[mounts]]
  source = "strata_sp_altitude_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
