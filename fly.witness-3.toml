app = "strata-email-witness-3"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  WITNESS_ID = "w3"
  WITNESS_KEY_ID = "witness:w3:fly"
  WITNESS_KEY_FILE = "/data/witness.key.json"
  WITNESS_WAL = "/data/witness.wal.jsonl"

[[mounts]]
  source = "strata_email_witness_3_data"
  destination = "/data"

[processes]
  app = "node /app/vendor/strata-ebo-turnstile/bin/turnstile-witness.js"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
