app = "strata-email-registry"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  PUBLIC_BASE_URL = "https://strata-email-registry.fly.dev"
  REGISTRY_KEY_ID = "registry-authority:email-demo"
  REGISTRY_KEY_FILE = "/data/registry-authority.key.json"
  EMAIL_REGISTRY_EPOCH_ID = "email-demo-epoch-002"
  TENANT_ID = "default"
  OPERATOR_ID = "operator:amotivv-demo"
  OPERATOR_ADMISSION_KEY_ID = "operator-admission:amotivv-demo"
  OPERATOR_ADMISSION_PUBLIC_KEY_PEM_BASE64 = "LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KTUNvd0JRWURLMlZ3QXlFQVpLaW5La3lIcDFBemR6NExSQ05QaG13L1BPVTdqVmgzcS83OGU5THhKbHc9Ci0tLS0tRU5EIFBVQkxJQyBLRVktLS0tLQo="
  WITNESS_URLS = "strata-witness-poc-1=https://strata-witness-poc-1.amotivv.containers.tinfoil.dev,strata-witness-poc-2=https://strata-witness-poc-2.amotivv.containers.tinfoil.dev,strata-witness-poc-3=https://strata-witness-poc-3.amotivv.containers.tinfoil.dev"
  POLICY_WITNESS_URLS = "p1=https://strata-email-policy-witness-1.fly.dev,p2=https://strata-email-policy-witness-2.fly.dev,p3=https://strata-email-policy-witness-3.fly.dev"

[[mounts]]
  source = "strata_email_registry_data"
  destination = "/data"

[processes]
  app = "node /app/bin/registry-server.js"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
