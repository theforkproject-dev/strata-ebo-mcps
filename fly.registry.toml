app = "strata-email-registry"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  REGISTRY_KEY_ID = "registry-authority:email-demo"
  REGISTRY_KEY_FILE = "/data/registry-authority.key.json"
  WITNESS_URLS = "w1=https://strata-email-witness-1.fly.dev,w2=https://strata-email-witness-2.fly.dev,w3=https://strata-email-witness-3.fly.dev"
  POLICY_WITNESS_URLS = "p1=https://strata-email-policy-witness-1.fly.dev,p2=https://strata-email-policy-witness-2.fly.dev,p3=https://strata-email-policy-witness-3.fly.dev"

[[mounts]]
  source = "strata_email_registry_data"
  destination = "/data"

[processes]
  app = "node /app/bin/registry-server.js"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
